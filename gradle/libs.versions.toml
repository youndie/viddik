[versions]
compose-material3 = "1.12.0-alpha03"
kotlinpoet = "2.3.0"
backdrop = "2.0.1"
junitJupiter = "6.1.3"
junitPlatform = "6.1.3"
kotlinx-coroutines = "1.11.0"
androidx-activity = "1.11.0"
dokka = "2.2.0"
# The shared build conventions. One number: every sborka plugin below takes its version from here.
# `ktlint` is gone from this file — it named the PLUGIN version here and the TOOL version in nine
# other repositories, which is one key meaning two things. `sborka.lint` applies the plugin and pins
# the tool.
sborka = "0.4.0.89"
# The compiler comes with them: `wip`, the catalog a sborka release publishes, carries kotlin,
# ksp, agp and composeMultiplatform, plus the Compose artefacts more than one repository names.
# The three this repository is alone in needing — ui-test-junit4 and the two KSP ones — are
# spelled in the modules that use them, against `wip.versions.*`: the shared file admits what
# going out of step BETWEEN repositories would break, and there is nothing here to be out of
# step with.

[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

# The Android showroom host only (viddik-showroom's androidMain). Kept out of viddik-annotations on
# purpose: AndroidX activity 1.11 pulls the KMP androidx.lifecycle/savedstate artifacts, whose klibs
# carry the same `unique_name` as the org.jetbrains.androidx forks Compose Multiplatform ships, and a
# module with native targets then fails its metadata compilation on duplicate-library warnings.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# `compileOnly` on the Gradle plugin's classpath: the consumer's own KGP/KSP versions win at runtime.
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

# Third-party glass, on the test classpath only: the one library whose layer recording turned a
# @Composable modifier factory into a JVM crash (issue #11), so the regression is pinned against the
# real thing rather than against a reconstruction of it.
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }

[plugins]
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
# The samples build only: an Android *application* is not a KMP module, so it takes the plain pair.
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
