[versions]
kotlin = "2.4.10"
androidGradlePlugin = "9.3.2"
ksp = "2.3.11"
compose-multiplatform = "1.12.0"
compose-material3 = "1.12.0-alpha03"
kotlinpoet = "2.3.0"
backdrop = "2.0.1"
junitJupiter = "6.1.3"
junitPlatform = "6.1.3"
kotlinx-coroutines = "1.11.0"
dokka = "2.2.0"
# The shared build conventions. One number: every sborka plugin below takes its version from here.
# `ktlint` is gone from this file — it named the PLUGIN version here and the TOOL version in nine
# other repositories, which is one key meaning two things. `sborka.lint` applies the plugin and pins
# the tool.
sborka = "0.1.0.8"

[libraries]
ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose-multiplatform" }

kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
# `compileOnly` on the Gradle plugin's classpath: the consumer's own KGP/KSP versions win at runtime.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

# Third-party glass, on the test classpath only: the one library whose layer recording turned a
# @Composable modifier factory into a JVM crash (issue #11), so the regression is pinned against the
# real thing rather than against a reconstruction of it.
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }

[plugins]
sborkaKmp = { id = "ru.workinprogress.sborka.kmp", version.ref = "sborka" }
sborkaJvm = { id = "ru.workinprogress.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "ru.workinprogress.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "ru.workinprogress.sborka.publish", version.ref = "sborka" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
