#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
#Viddik
# The head of the version; CI appends the run number through -PVERSION. Plain `version`, which Gradle
# reads on its own and which sborka's determine-version action expects by default — `viddik.version`
# was one more name for the same thing.
version=0.4.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.viddik
sborka.repository=youndie/viddik
sborka.description=A screenshot-testing toolkit for Compose Multiplatform: KSP-generated fixtures, deterministic rendering, record and verify tasks.
sborka.inceptionYear=2026

# 21 for both, and the floor is not a guess: viddik's own jars are compiled for 21, so a consumer on
# a 17 runtime cannot load them — and the metadata has to say so, or that consumer resolves the
# library, compiles against it, and meets UnsupportedClassVersionError at class loading.
sborka.jvmToolchain=21
sborka.jvmFloor=21

# MAVEN CENTRAL, and the coordinate is what made this a 0.4.0 rather than a 0.3.4.
#
# `ru.workinprogress` cannot go there: the portal verifies a domain namespace by a DNS record on the
# domain itself, and workinprogress.ru is a parked lot on reg.ru that belongs to somebody selling it.
# `io.github.<login>` is proved by owning the GitHub account, and it is already carrying bochka.
#
# The Gradle plugin is why the group alone was not enough. A plugin marker takes its groupId from the
# plugin id, not from `sborka.group` -- a dry run put it at
# `ru.workinprogress.viddik:ru.workinprogress.viddik.gradle.plugin` -- so the id moved with the rest,
# and the Kotlin packages went with it rather than leaving one break to be paid for twice.
sborka.central=true
